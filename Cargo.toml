[workspace]

[package]
name = "hl-agent"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Guardrailed Hyperliquid kit for AI agents: a stdio MCP server with read-only market tools, a dry-run order simulator, and an OPTIONAL live-order path that signs with YOUR OWN sign-only agent key after the guardrail caps pass. Dry-run is the default: no key, no order."

[[bin]]
name = "hl-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"] }
guardrail = { path = "guardrail" }
alloy-primitives = { version = "1.7", default-features = false, features = ["std", "k256"] }
alloy-signer = { version = "2.5", default-features = false }
alloy-signer-local = { version = "2.5", default-features = false }
